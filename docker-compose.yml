services:
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  robot-r1:
    build: .
    command: python simulator/robot_simulator.py
    environment:
      ROBOT_ID: r1
      BACKEND_URL: http://backend:8000/api/robots/events
    depends_on:
      - backend

  robot-r2:
